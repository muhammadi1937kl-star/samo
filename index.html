<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>Отчёты отдела</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pr:#2563eb;--ok:#16a34a;--wn:#f59e0b;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155}}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:15px Roboto,system-ui,sans-serif}
button,input,textarea{font-family:inherit}
#app{max-width:480px;width:100%;margin:auto;min-height:100vh;display:flex;flex-direction:column}
.top{padding:16px;background:var(--pr);color:#fff;display:flex;align-items:center;gap:6px}
.top small{display:block;opacity:.85;margin-top:2px}
.bk{font-size:30px;line-height:1;padding:0 10px 4px 0;cursor:pointer}
.bd{flex:1;padding:14px;padding-bottom:80px;display:flex;flex-direction:column;gap:10px}
.bd>*{min-width:0;max-width:100%}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.mu{color:var(--mu);font-size:13px}.lb{font-size:12px;color:var(--mu);text-transform:uppercase;margin-top:6px}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 12px;min-height:46px;transition:.2s}
.f input{width:140px;min-width:0;text-align:right;border:0;background:none;color:var(--tx);font-weight:700;font-size:16px;outline:none}
.f2{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}
.seg{display:flex;background:var(--bd);border-radius:10px;padding:3px;margin-top:8px;gap:3px}
.sg{flex:1;text-align:center;padding:9px 0;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);transition:background .2s,color .2s,transform .12s;user-select:none}
.sg:active{transform:scale(.95)}.sg.on{background:var(--pr);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.35)}
.mv{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:0 12px;height:54px;margin-top:8px;transition:.2s}
.mv:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.mv input{flex:1;min-width:0;width:100%;border:0;background:none;color:var(--tx);font-weight:700;font-size:22px;outline:none;text-align:right}
.mv em{font-style:normal;color:var(--mu);margin-left:8px;font-size:15px;min-width:44px}
.mi{display:flex;gap:8px;margin-top:6px}
.mi label{flex:1;display:flex;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:0 10px;height:44px;transition:.2s}
.mi input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font-weight:700;font-size:16px;outline:none;text-align:right}
.mi em{font-style:normal;color:var(--mu);margin-left:6px;font-size:13px}
.f:focus-within,.mi label:focus-within,input.in:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
input.in,textarea{width:100%;height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:var(--card);color:var(--tx);font-size:15px;outline:none;transition:.2s}
textarea{height:70px;padding:10px;resize:vertical}
/* кнопки + анимации */
.btn,.chip,.nav span,.kc{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .12s,filter .15s,background .2s,box-shadow .2s}
.btn{height:48px;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;font-size:15px;width:100%;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.btn.p{background:var(--pr)}.btn.dg{background:var(--er)}.btn.o{background:var(--card);color:var(--pr);border:1px solid var(--pr);box-shadow:none}
.btn:hover{filter:brightness(1.1)}.btn:active,.chip:active,.kc:active{transform:scale(.96)}
.btn.ld{pointer-events:none;color:transparent!important}
.btn.ld::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn.o.ld::after{border-color:rgba(37,99,235,.3);border-top-color:var(--pr)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .55s ease-out;pointer-events:none}
.o .rp,.chip .rp,.nav .rp,.kc .rp{background:rgba(37,99,235,.25)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes sh{to{background-position:-200% 0}}
.bd.in>*{animation:up .3s both}
.bd.in>:nth-child(2){animation-delay:.04s}.bd.in>:nth-child(3){animation-delay:.08s}.bd.in>:nth-child(4){animation-delay:.12s}.bd.in>:nth-child(5){animation-delay:.16s}.bd.in>:nth-child(n+6){animation-delay:.2s}
.pop{animation:pop .5s}
.sk{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--bd) 25%,rgba(128,128,128,.18) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav span{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--mu);cursor:pointer}.nav span.on{color:var(--pr);font-weight:700}
.nav em{font-style:normal}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);font-size:13px;cursor:pointer;display:inline-block}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kp i{font-style:normal;font-size:12px;color:var(--mu)}.kp b{display:block;font-size:22px}.kp.h b{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
tr.cl{cursor:pointer;transition:background .15s}tr.cl:active{background:rgba(37,99,235,.12)}
.d{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}.green{background:var(--ok)}.yellow{background:var(--wn)}.red{background:var(--er)}.gray{background:#9ca3af}
.tg{font-size:11px;background:var(--bd);padding:2px 6px;border-radius:6px;color:var(--mu)}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars div{flex:1;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s}
.bl{display:flex;gap:6px}.bl span{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.ir{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:10px}.ir:last-child{border:0}
.err{color:var(--er);font-size:13px;min-height:16px}.ctr{text-align:center}.big{font-size:48px}
.bd.lg{margin:auto;max-width:420px;width:100%;padding-bottom:24px}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;animation:up .25s;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3)}.ts.er{background:var(--er)}.ts.ok{background:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}
.md{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px;animation:su .28s ease;max-height:92vh;overflow:auto}
@media(min-width:600px) and (max-width:899px){#app{max-width:640px}.nav{max-width:640px}}
@media(min-width:900px){
 body{font-size:16px}
 #app{max-width:none;padding-left:230px}#app.nl{padding-left:0}
 .top{padding:20px 32px;font-size:18px}
 .bd{width:100%;max-width:960px;margin:0 auto;padding:24px 32px;gap:14px}
 .nav{left:0;top:0;bottom:0;transform:none;width:230px;max-width:none;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:20px 12px;gap:4px}
 .nav::before{content:'📊 Отчёты отдела';font-weight:700;font-size:17px;padding:6px 14px 20px}
 .nav span{flex:none;text-align:left;padding:12px 14px;font-size:15px;border-radius:10px}
 .nav span:hover{background:rgba(37,99,235,.08)}.nav span.on{background:rgba(37,99,235,.14)}
 .nav br{display:none}.nav em{font-size:20px;margin-right:12px;vertical-align:middle}
 .kg{grid-template-columns:repeat(3,1fr);gap:12px}.kp b{font-size:26px}
 table{font-size:15px}th,td{padding:12px 8px}tr.cl:hover{background:rgba(37,99,235,.07)}
 .bars{height:180px}.bl span{font-size:13px}
 .btn{max-width:320px}.bd.lg .btn,.md .btn{max-width:none}
 .chip:hover{border-color:var(--pr)}.kc:hover{border-color:var(--pr)}
 .ov{align-items:center}.md{border-radius:18px;max-width:440px}.ts{bottom:30px}
}

.rr{display:flex;gap:6px;align-items:center}
.logo{display:flex;gap:7px;align-items:flex-end;justify-content:center;height:70px;margin:auto}
.logo i{width:15px;border-radius:5px;display:block;transform-origin:bottom;animation:lg .8s cubic-bezier(.2,1.5,.4,1) both,bob 2.2s ease-in-out infinite}
.logo i:nth-child(1){height:38px;background:#84cc16;animation-delay:0s,1s}
.logo i:nth-child(2){height:60px;background:#ec4899;animation-delay:.15s,1.2s}
.logo i:nth-child(3){height:48px;background:#2563eb;animation-delay:.3s,1.4s}
@keyframes lg{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{50%{transform:scaleY(.86)}}
.ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-60px);opacity:0;z-index:60;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;transition:opacity .2s}
.ptr.spin{animation:spr .7s linear infinite}
@keyframes spr{to{rotate:360deg}}
</style></head><body><div id="app"></div>
<script>
// ====== 1) ВСТАВЬТЕ СЮДА URL ВАШЕГО Apps Script (Web app) ======
const API = 'https://script.google.com/macros/s/AKfycbwsVBWvOh9es56U8l6LgRBAbSQupX3vDLsEA_8ySVyebt3PcxfDMqsJrmHIOge-r5IL/exec';

const $ = (s, r = document) => r.querySelector(s), $$ = s => document.querySelectorAll(s), app = $('#app');
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const S = { token: localStorage.token || '', user: null, st: {}, today: iso(new Date()), tab: '', range: '7', from: '', to: '', nav: 0, edit: false, rep: null, draft: null, dd: null, cid: '' };
const fmt = n => Number(n || 0).toLocaleString('ru');
const dm = d => d.slice(8, 10) + '.' + d.slice(5, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HASHRE = /^[0-9a-f]{64}$/;
const sk = n => Array(n).fill('<div class="sk"></div>').join('');

// ====== СЕТЬ + КЭШ (быстро: показываем сохранённое сразу, обновляем в фоне) ======
const inflight = {};
function api(a, o = {}) {
  const d = encodeURIComponent(JSON.stringify({ a, token: S.token, ...o }));
  if (inflight[d]) return inflight[d];
  return inflight[d] = fetch(API + '?d=' + d).then(r => r.json(), () => { throw new Error('Нет связи с сервером'); })
    .then(r => { if (r.error) { if (/Сессия/.test(r.error)) logout(); throw new Error(r.error); } return r; })
    .finally(() => delete inflight[d]);
}
const ck = k => 'c:' + (S.user ? S.user.id : '') + ':' + k;
const cget = k => { try { return JSON.parse(localStorage.getItem(ck(k))); } catch (e) { return null; } };
const cset = (k, d) => { try { localStorage.setItem(ck(k), JSON.stringify(d)); } catch (e) {} };
const cclear = () => Object.keys(localStorage).filter(k => k.startsWith('c:')).forEach(k => localStorage.removeItem(k));
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName) && $('.bd') && $('.bd').contains(a); };

async function swr(key, a, o, render, skel) {
  const my = S.nav, hit = cget(key);
  if (hit) render(hit, true); else if (skel) skel();
  try {
    const d = await api(a, o);
    cset(key, d);
    if (my !== S.nav) return;
    if (!hit || JSON.stringify(hit) !== JSON.stringify(d)) { if (hit && typing()) return; render(d, !!hit); }
  } catch (e) { if (my === S.nav && !hit) fail(e.message, () => swr(key, a, o, render, skel)); }
}
function fail(msg, retry) {
  $('.bd').innerHTML = `<div class="c ctr">⚠️ ${esc(msg)}<br><br><button class="btn p" id="rt">Повторить</button></div>`;
  $('#rt').onclick = retry;
}
async function run(btn, fn) { // кнопка крутится, пока идёт запрос
  if (btn.classList.contains('ld')) return;
  btn.classList.add('ld');
  try { await fn(); } finally { btn.classList.remove('ld'); }
}
function toast(m, c = '') {
  const e = document.createElement('div'); e.className = 'ts ' + c; e.textContent = m; document.body.appendChild(e);
  setTimeout(() => { e.style.transition = 'opacity .3s'; e.style.opacity = 0; }, 2200); setTimeout(() => e.remove(), 2600);
}
function modal(html) {
  closeModal();
  const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div class="md">' + html + '</div>';
  o.onclick = e => { if (e.target === o) closeModal(); };
  document.body.appendChild(o);
}
const closeModal = () => $$('.ov').forEach(x => x.remove());
document.addEventListener('pointerdown', e => { // эффект волны при нажатии
  const t = e.target.closest('.btn,.chip,.nav span,.kc'); if (!t) return;
  const r = t.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, x = document.createElement('span');
  x.className = 'rp'; x.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  t.appendChild(x); setTimeout(() => x.remove(), 600);
});

function logout() {
  ['token', 'user', 'st'].forEach(k => localStorage.removeItem(k)); cclear();
  S.token = ''; S.user = null; closeModal(); login();
}

// ====== ОБОЛОЧКА ======
const MT = [['report', '📊', 'Отчёт'], ['history', '📈', 'История'], ['profile', '👤', 'Профиль']];
const RT = [['dash', '📊', 'Дашборд'], ['team', '👥', 'Команда'], ['period', '📅', 'Период'], ['settings', '⚙️', 'Настройки']];
function shell(title, sub, body, tabs, silent, back) {
  const key = tabs ? tabs.map(t => t[0]).join() : '', topH = (back ? '<span class="bk" id="bk">‹</span>' : '') + `<div><b>${title}</b><small>${sub || ''}</small></div>`;
  if (tabs && app.dataset.nav === key) {
    $('.top').innerHTML = topH; const b = $('.bd'); b.innerHTML = body; b.className = 'bd' + (silent ? '' : ' in');
    $$('.nav span').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab));
  } else {
    app.dataset.nav = key; app.className = tabs ? '' : 'nl';
    app.innerHTML = `<div class="top">${topH}</div><div class="bd${silent ? '' : ' in'}">${body}</div>` +
      (tabs ? `<div class="nav">${tabs.map(t => `<span data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><em>${t[1]}</em><br>${t[2]}</span>`).join('')}</div>` : '');
  }
  if (back) $('#bk').onclick = back;
  if (!silent) window.scrollTo(0, 0);
}
const VIEWS = {};
function go(t) { S.nav++; S.tab = t; S.edit = false; S.inCard = false; VIEWS[t](); }
function pick(r, fn) { S.range = r; S.nav++; VIEWS[fn](); }
function range() {
  const t = new Date(), y = new Date(t - 864e5);
  if (S.range === 'today') return [iso(t), iso(t)];
  if (S.range === 'yest') return [iso(y), iso(y)];
  if (S.range === '7') return [iso(new Date(t - 6 * 864e5)), iso(t)];
  if (S.range === 'month') return [iso(t).slice(0, 8) + '01', iso(t)];
  return [S.from || iso(t), S.to || iso(t)];
}
const chips = (fn, list) => `<div class="chips">${list.map(x => `<span class="chip ${S.range === x[0] ? 'on' : ''}" onclick="pick('${x[0]}','${fn}')">${x[1]}</span>`).join('')}</div>`;
const DCH = [['today', 'Сегодня'], ['yest', 'Вчера'], ['7', '7 дней'], ['month', 'Месяц']];

// ====== ВХОД ======
function login(err = '') {
  app.dataset.nav = ''; app.className = 'nl';
  app.innerHTML = `<div class="bd lg in" style="justify-content:center"><div class="logo"><i></i><i></i><i></i></div>
  <div class="ctr"><b style="font-size:20px">Отчёты отдела</b><div class="mu">Войдите, чтобы продолжить</div></div>
  <div class="lb">Телефон</div><input class="in" id="ph" inputmode="tel" placeholder="9XXXXXXXX">
  <div class="lb">Пароль</div><input class="in" id="pw" type="password" placeholder="••••••••">
  <div class="err" id="er">${err}</div><button class="btn p" id="bt">Войти</button></div>`;
  $('#bt').onclick = () => run($('#bt'), async () => {
    $('#er').textContent = '';
    try {
      const [f, t] = range(), r = await api('login', { phone: $('#ph').value, password: $('#pw').value, from: f, to: t });
      S.token = r.token; S.user = r.user; S.st = r.settings;
      localStorage.token = r.token; localStorage.user = JSON.stringify(r.user); localStorage.st = JSON.stringify(r.settings);
      cset(r.user.role === 'rop' ? `dash:${f}:${t}` : 'my', r.init);
      start();
    } catch (e) { $('#er').textContent = e.message; }
  });
  ['ph', 'pw'].forEach(i => $('#' + i).onkeydown = e => { if (e.key === 'Enter') $('#bt').click(); });
}
function start() {
  go(S.user.role === 'rop' ? 'dash' : 'report');
  setTimeout(() => { // подгружаем остальные вкладки заранее
    const bg = (k, a, o) => api(a, o).then(d => cset(k, d)).catch(() => {});
    if (!S.user) return;
    if (S.user.role === 'rop') { bg('team', 'team'); bg('settings', 'getSettings'); }
    else { const [f, t] = range(); bg(`hist:${f}:${t}`, 'history', { from: f, to: t }); }
  }, 1200);
}

// ====== МЕНЕДЖЕР ======
const FIELDS = ['calls', 'broadcasts', 'sales', 'awaiting_payment'];
const CUR = [['sales_amount', 'сомони'], ['sales_usd', '$']]; // чтобы добавить валюту: новая колонка в таблице + строка здесь
const num = (id, l, v) => `<label class="f"><span>${l}</span><input id="${id}" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${esc(v)}"></label>`;
VIEWS.report = () => swr('my', 'myReport', {}, (d, s) => reportView(d.report, s), () => shell('Отчёт', dm(S.today), sk(4), MT));
function reportView(r, silent) {
  S.rep = r; const t = S.today, h = new Date().getHours();
  if (r && !S.edit) {
    shell('Отчёт', dm(t) + '.' + t.slice(0, 4), `<div class="ctr big pop" style="margin-top:16px">✅</div>
    <div class="ctr"><b>Отчёт за ${dm(t)} отправлен</b><div class="mu">Время отправки: ${r.submitted_at.slice(11)}</div></div>
    <div class="c mu">📞 Звонки ${r.calls} · 📢 Рассылки/Переписки ${r.broadcasts}<br>💰 Продажи ${r.sales} · ${fmt(r.sales_amount)} сомони · $${fmt(r.sales_usd)}<br>⏳ Ожидают оплаты ${r.awaiting_payment}</div>
    <button class="btn o" id="ed">✏️ Исправить</button>
    <div class="mu ctr">Удалять отчёт нельзя. Правки сохраняются:<br>отправлен ${r.submitted_at.slice(11)} · изменён ${r.updated_at.slice(11)}</div>`, MT, silent);
    $('#ed').onclick = () => { S.edit = true; reportView(r); };
    return;
  }
  const v = S.draft || r || {}; S.draft = null;

// ====== ОТЛОЖЕННАЯ ОТПРАВКА ======
let flushing = false;
async function flushPending() {
  if (flushing || !localStorage.pend || !S.token) return;
  let p; try { p = JSON.parse(localStorage.pend); } catch (e) { localStorage.removeItem('pend'); return; }
  if (!S.user || p.uid !== S.user.id) return;
  if (p.date !== iso(new Date())) { localStorage.removeItem('pend'); toast('Отчёт за ' + dm(p.date) + ' не был отправлен', 'er'); return; }
  flushing = true;
  try { const x = await api('saveReport', { r: p.r }); localStorage.removeItem('pend'); cset('my', x); toast('Отчёт отправлен ✅', 'ok'); }
  catch (e) { if (!/Нет связи/.test(e.message)) { localStorage.removeItem('pend'); toast(e.message, 'er'); } }
  flushing = false;
}
setInterval(flushPending, 15000); addEventListener('online', flushPending);

// ====== ПОТЯНИТЕ ВНИЗ, ЧТОБЫ ОБНОВИТЬ ======
const ptr = document.createElement('div'); ptr.className = 'ptr'; ptr.textContent = '⟳'; document.body.appendChild(ptr);
let py = 0, pulling = false;
const ptrReset = () => { ptr.classList.remove('spin'); ptr.style.opacity = 0; ptr.style.transform = 'translate(-50%,-60px)'; };
addEventListener('touchstart', e => { if (window.scrollY <= 0 && !$('.ov') && S.user) { py = e.touches[0].clientY; pulling = true; } }, { passive: true });
addEventListener('touchmove', e => {
  if (!pulling) return; const d = e.touches[0].clientY - py;
  if (d > 0) { ptr.style.opacity = Math.min(d / 70, 1); ptr.style.transform = `translate(-50%,${Math.min(d, 100) - 50}px) rotate(${d * 3}deg)`; }
}, { passive: true });
addEventListener('touchend', async e => {
  if (!pulling) return; pulling = false;
  if (e.changedTouches[0].clientY - py > 70) {
    ptr.classList.add('spin'); ptr.style.opacity = 1; ptr.style.transform = 'translate(-50%,20px)';
    await flushPending(); cclear(); S.nav++; S.edit = false;
    (S.inCard && VIEWS.card ? VIEWS.card : VIEWS[S.tab])();
    setTimeout(() => { ptrReset(); toast('Обновлено ✅', 'ok'); }, 900);
  } else ptrReset();
});

// ====== СТАРТ ======
(async () => {
  if (S.token) {
    try { S.user = JSON.parse(localStorage.user); S.st = JSON.parse(localStorage.st || '{}'); } catch (e) { S.user = null; }
    const chk = () => api('me').then(r => { S.user = r.user; S.st = r.settings; localStorage.user = JSON.stringify(r.user); localStorage.st = JSON.stringify(r.settings); });
    if (S.user) { start(); chk().catch(() => {}); return; } // мгновенно из сохранённого
    try { await chk(); return start(); } catch (e) {}
  }
  login();
})();
</script></body></html>
